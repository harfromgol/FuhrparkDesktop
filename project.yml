name: FuhrparkDesktop
options:
  bundleIdPrefix: de.gerdklaus
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: de

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.6"
    CURRENT_PROJECT_VERSION: "7"

targets:
  FuhrparkDesktop:
    type: application
    platform: macOS
    deploymentTarget: "26.0"
    sources:
      - Fuhrpark
      - FuhrparkDesktop
    settings:
      base:
        PRODUCT_NAME: FuhrparkDesktop
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_APP_SANDBOX: YES
        CODE_SIGN_STYLE: Automatic
      # Debug und Release bekommen eigene Bundle-IDs. Da die App sandboxed
      # ist, hängt der Container-Pfad daran – und damit alles, was darin
      # liegt: die Core-Data-Datenbank, die UserDefaults (also auch das
      # Lesezeichen aufs Arbeitsverzeichnis) und die erteilten
      # Systemberechtigungen. Ohne diese Trennung arbeitet der Debug-Build
      # auf den echten Daten, und der Abgleich in DocumentCleanup löscht
      # dort Belegordner, die die jeweils andere Datenbank angelegt hat.
      #
      # PRODUCT_NAME bleibt in beiden Konfigurationen gleich, damit Build-,
      # Skript- und DMG-Pfade stabil bleiben; unterschieden wird über
      # CFBundleName/CFBundleDisplayName und das App-Icon.
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: de.gerdklaus.FuhrparkDesktop.debug
          APP_DISPLAY_NAME: FuhrparkDesktop Debug
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIconDebug
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: de.gerdklaus.FuhrparkDesktop
          APP_DISPLAY_NAME: FuhrparkDesktop
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: FuhrparkDesktop/Info.plist
      properties:
        # Beide aus derselben Quelle: CFBundleName trägt den Namen in der
        # Menüleiste, CFBundleDisplayName den im Finder.
        CFBundleDisplayName: "$(APP_DISPLAY_NAME)"
        CFBundleName: "$(APP_DISPLAY_NAME)"
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSPrincipalClass: NSApplication
        NSMainStoryboardFile: ""
        LSApplicationCategoryType: public.app-category.utilities
        CFBundleDevelopmentRegion: de
        CFBundleLocalizations:
          - de
          - en
        NSLocationWhenInUseUsageDescription: "FuhrparkDesktop verwendet deinen Standort, um Tankstellen und Spritpreise in deiner Umgebung anzuzeigen."
    entitlements:
      path: FuhrparkDesktop/FuhrparkDesktop.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.network.client: true
        com.apple.security.personal-information.location: true
